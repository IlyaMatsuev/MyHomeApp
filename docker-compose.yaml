services:
  altserver:
    build:
      # Dockerized AltServer-Linux to use over WIFI:
      # - AltServer
      # - netmuxd (Wi-Fi device discovery)
      context: https://github.com/dreth/Altserver-docker.git
    container_name: altserver
    restart: always
    # Required for mDNS
    network_mode: host
    # Grant permission to OPEN the USB device nodes
    device_cgroup_rules:
      - 'c 189:* rmw'
    environment:
      - ALLOW_PROVISION_TO_DOWNLOAD_LIBS=true
      # iOS 26: the patched AltServer signs with rcodesign instead of ldid. See scripts/install_ios26_signer.sh.
      - ALTSERVER_RCODESIGN=/altserver/bin/rcodesign
      # Uncomment and set if architecture auto-detect is wrong (x86_64 / aarch64):
      # - OVERRIDE_ALTSERVER_ARCH=x86_64
      # - OVERRIDE_NETMUXD_ARCH=x86_64
      # - OVERRIDE_ANISETTE_ARCH=x86_64
      # - OVERRIDE_PROVISION_LIBS_ARCH=x86_64
    volumes:
      # anisette / Provision libs (persisted)
      - ./lib:/root/.config/Provision/lib
      # AltServer binary + AltStore.ipa
      - ./bin:/altserver/bin
      - ./logs:/altserver/logs
      # Device pairing records
      - /var/lib/lockdown:/var/lib/lockdown
      # USB access for the first pairing
      - /dev/bus/usb:/dev/bus/usb
      # usbmuxd socket
      - /var/run:/var/run
